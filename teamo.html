<html lang="es">
<head>
<meta charset="UTF-8">
<title>DOMA - Misterio de Mujer</title>

<style>
:root{--bg:#030108;--dim:#1c0c16;--gold:#E8C87A;--rose:#E8A0B4;--pink:#FF6B9D;--lav:#C4A8CC;--wht:#F0EAE0}

body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 15% 100%,rgba(140,20,60,.12) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 85% 0%,rgba(80,10,100,.08) 0%,transparent 60%)}
#notes{position:fixed;inset:0;pointer-events:none;z-index:1}
.note{position:absolute;pointer-events:none;bottom:-50px;animation:floatUp linear forwards}
@keyframes floatUp{0%{transform:translateY(0) rotate(-5deg) scale(.8);opacity:0}8%{opacity:1}85%{opacity:.35}100%{transform:translateY(-110vh) rotate(12deg);opacity:0}}
#stage{position:relative;z-index:2;width:88vw;max-width:1050px;text-align:center;opacity:0;transition:opacity .7s ease}
#wrap{will-change:transform,opacity}
.lyric-line{font-size:clamp(2.2rem,5.2vw,5.5rem);font-weight:600;line-height:1.4;letter-spacing:.015em;min-height:1.4em}
.ww{display:inline-block;transform-origin:center 80%}
 

@keyframes holdPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.03)}
  100%{transform:scale(1)}
}

.ww.holding{animation:holdPulse var(--hd,1.2s) ease-in-out infinite}
 
.ch{display:inline;color:var(--dim);transition:color .15s ease,text-shadow .15s ease}
.ch.garamond{font-family:'Cormorant Garamond',serif}
.ch.playfair{font-family:'Playfair Display',serif}
.ch.vibes{font-family:'Great Vibes',cursive;font-size:1.15em}
.ch.cinzel{font-family:'Cinzel',serif;letter-spacing:.08em}
.ch.soft{font-style:italic;font-weight:400}
.ch.normal{font-weight:600}
.ch.dramatic{font-weight:700}
.ch.passion{font-weight:700}
.ch.romantic{font-style:italic;font-weight:600}
.ch.normal.lit{color:var(--gold);text-shadow:0 0 10px rgba(232,200,122,.95),0 0 30px rgba(232,200,122,.55),0 0 65px rgba(232,200,122,.2)}
.ch.soft.lit{color:var(--lav);text-shadow:0 0 10px rgba(196,168,204,.95),0 0 30px rgba(196,168,204,.5)}
.ch.dramatic.lit{color:var(--wht);text-shadow:0 0 12px rgba(240,234,224,1),0 0 40px rgba(240,234,224,.65),0 0 85px rgba(240,234,224,.25)}
.ch.passion.lit{color:var(--pink);text-shadow:0 0 12px rgba(255,107,157,1),0 0 38px rgba(255,107,157,.7),0 0 80px rgba(255,107,157,.3)}
.ch.romantic.lit{color:var(--rose);text-shadow:0 0 10px rgba(232,160,180,.95),0 0 32px rgba(232,160,180,.55),0 0 68px rgba(232,160,180,.2)}
.sep{width:120px;height:1px;margin:2.4vh auto;background:linear-gradient(to right,transparent,rgba(196,168,204,.28),transparent)}
#nexts{line-height:1.75}
.n1{font-size:clamp(.85rem,1.8vw,1.45rem);color:#2A1220;margin:1.2vh 0;transition:all .5s;font-family:'Playfair Display',serif}
.n2{font-size:clamp(.75rem,1.4vw,1.15rem);color:#1A0A14;margin:.7vh 0;transition:all .5s}
.n3{font-size:clamp(.65rem,1.1vw,.95rem);color:#100608;margin:.5vh 0;transition:all .5s}
@keyframes inUp{from{transform:translateY(46px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes outUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
.in-up{animation:inUp .48s cubic-bezier(.22,1,.36,1) forwards}
.out-up{animation:outUp .38s cubic-bezier(.64,0,.78,0) forwards}
#intro{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s ease}
#intro h1{font-family:'Great Vibes',cursive;font-size:clamp(5rem,16vw,14rem);font-weight:400;color:var(--rose);letter-spacing:.05em;text-shadow:0 0 60px rgba(232,160,180,.4)}
#intro .sub{font-family:'Playfair Display',serif;font-size:clamp(.9rem,2vw,1.5rem);color:#4a2030;margin-top:.5rem;font-style:italic;letter-spacing:.16em}
#btn{margin-top:3.5rem;padding:.9rem 3.2rem;background:transparent;border:1px solid rgba(232,160,180,.35);color:var(--rose);font-family:'Playfair Display',serif;font-size:1rem;cursor:pointer;letter-spacing:.16em;transition:all .3s}
#btn:hover{background:rgba(232,160,180,.07);box-shadow:0 0 28px rgba(232,160,180,.2)}
#sync{position:fixed;top:2vh;right:2.5vw;z-index:5;color:#180a10;font-size:.65rem;transition:color .3s;font-family:sans-serif}
#sync.glow{color:#7a3a50}
#hint{position:fixed;bottom:2.5vh;left:50%;transform:translateX(-50%);color:#100508;font-size:.65rem;z-index:3;white-space:nowrap;font-family:sans-serif}
</style>
</head>

    for(var ci=0;ci<chars.length;ci++){
      var sp=document.createElement('span');
      sp.className='ch '+typeCls+' '+fontCls;
      sp.textContent=chars[ci].c;
      sp.setAttribute('data-wi',wi2[wi]);sp.setAttribute('data-ci',ci);
      ww.appendChild(sp);
    }
    el.appendChild(ww);
  }
}
 
function renderNexts(lineIdx){var c=document.getElementById('nexts');c.innerHTML='';var cs=['n1','n2','n3'];for(var j=0;j<3;j++){var ni=lineIdx+j+1;if(ni<LINES_TEXT.length){var d=document.createElement('div');d.className=cs[j];d.textContent=LINES_TEXT[ni];c.appendChild(d);}}}
 
function stopHolding(){if(holdingWW){holdingWW.classList.remove('holding');holdingWW.style.removeProperty('--hd');holdingWW=null;}}
 
function tick(){
  var t=getT();if(t<0)return;
  var found=-1;
  for(var li=0;li<LINES.length;li++){
    var firstT=CHAR_TIMINGS[LINES[li][0]][0].t,lastW=WORDS[LINES[li][LINES[li].length-1]],lineEnd=(li+1<LINES.length)?CHAR_TIMINGS[LINES[li+1][0]][0].t:lastW[1]+lastW[2]+1.5;
    if(t>=firstT&&t<lineEnd){found=li;break;}
  }
  if(found!==-1&&found!==activeLine&&!inTransition)setActiveLine(found);
 
  if(activeLine>=0){
    var wi2=LINES[activeLine];
    for(var wi=0;wi<wi2.length;wi++){
      var idx=wi2[wi],chars=CHAR_TIMINGS[idx],wdata=WORDS[idx],typeCls=wdata[4];
      var isHold=HOLD_SET.indexOf(idx)!==-1;
      for(var ci=0;ci<chars.length;ci++){
        var key=idx+'_'+ci;
        if(!litSet[key]&&t>=chars[ci].t){
          litSet[key]=true;
          var sp=document.querySelector('.ch[data-wi="'+idx+'"][data-ci="'+ci+'"]');
          if(sp){
            sp.classList.add('lit');
            // Nueva palabra no-hold empieza → detener holding
            if(!isHold&&ci===0&&holdingWW)stopHolding();
            // Ultima letra del hold word → palabra entera empieza a pulsar
            if(isHold&&chars[ci].hold){
              var ww=document.querySelector('.ww[data-wi="'+idx+'"]');
              if(ww){
                stopHolding();
                holdingWW=ww;
                // Duracion del ciclo calculada para que quepa en el tiempo restante
                var cycle=(HOLD_CYCLE[idx]||1.2)+'s';
                ww.style.setProperty('--hd',cycle);
                ww.classList.add('holding');
              }
            }
            if(typeCls==='passion'&&ci===0&&!heartsGone){
              heartsGone=true;
              setTimeout(function(){spawnHearts(sp);},80);
              setTimeout(function(){spawnHearts(sp);},1000);
            }
          }
        }
      }
    }
  }
}
 
function setActiveLine(idx){
  var wrap=document.getElementById('wrap');inTransition=true;
  function doRender(){
    stopHolding();
    activeLine=idx;heartsGone=false;litSet={};
    document.getElementById('stage').style.opacity='1';
    renderLine(idx);renderNexts(idx);
    wrap.className='';void wrap.offsetWidth;wrap.className='in-up';
    setTimeout(function(){inTransition=false;},500);
  }
  if(activeLine>=0){wrap.className='out-up';setTimeout(doRender,380);}else doRender();
}
setInterval(tick,35);
 
function tryLoadAudio(){var files=['doma.mp3','doma.wav','musica.mp3','cancion.mp3'],fi=0;function next(){if(fi>=files.length){usingTimer=true;startTime=performance.now();return;}aud.src=files[fi++];aud.load();function onReady(){aud.removeEventListener('canplay',onReady);aud.removeEventListener('error',onErr);aud.currentTime=AUDIO_START;aud.play().catch(function(){usingTimer=true;startTime=performance.now();});}function onErr(){aud.removeEventListener('canplay',onReady);aud.removeEventListener('error',onErr);next();}aud.addEventListener('canplay',onReady);aud.addEventListener('error',onErr);}next();}
function startShow(){document.getElementById('intro').style.opacity='0';setTimeout(function(){document.getElementById('intro').style.display='none';},1200);startNotes();tryLoadAudio();}
var syncT=null;document.addEventListener('keydown',function(e){if(e.key==='['){offset-=0.1;showSync();}if(e.key===']'){offset+=0.1;showSync();}});
function showSync(){var el=document.getElementById('sync');el.textContent='sync '+(offset>=0?'+':'')+offset.toFixed(1)+'s  [ ]';el.className='glow';clearTimeout(syncT);syncT=setTimeout(function(){el.className='';},2500);}
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){e.preventDefault();var f=e.dataTransfer.files[0];if(f&&f.type.indexOf('audio')===0){usingTimer=false;aud.src=URL.createObjectURL(f);aud.currentTime=AUDIO_START;aud.play();document.getElementById('hint').textContent='♪ '+f.name+' - desde 1:31';document.getElementById('hint').style.color='#3a1828';}});
</script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Ruleta de Recuerdos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Marcellus&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* --- ESTILOS GENERALES Y ESTÉTICA --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050510;
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%);
            color: #fff; font-family: 'Marcellus', serif;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 {
            font-family: 'Cinzel', serif; font-size: 2.5rem; color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5); margin: 30px 0 10px;
            letter-spacing: 4px; text-align: center;
        }
        .subtitle { color: rgba(255, 255, 255, 0.7); letter-spacing: 2px; margin-bottom: 30px; }

        /* --- ZONA DE CARGA --- */
        .upload-section {
            background: rgba(15, 15, 25, 0.6); backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px;
            padding: 20px 30px; display: flex; flex-wrap: wrap; gap: 15px;
            justify-content: center; align-items: center; max-width: 800px;
            margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.8rem; color: #d4af37; letter-spacing: 1px; }
        input[type="text"], input[type="date"], input[type="file"] {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.5);
            color: #fff; padding: 10px; border-radius: 5px; font-family: 'Marcellus', serif; outline: none;
        }
        input[type="file"] { cursor: pointer; }
        .btn-add {
            background: linear-gradient(45deg, #b8860b, #d4af37); color: #000;
            border: none; padding: 12px 25px; font-family: 'Cinzel', serif; font-weight: bold;
            border-radius: 5px; cursor: pointer; transition: all 0.3s ease; margin-top: 18px;
        }
        .btn-add:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(212, 175, 55, 0.8); }
        .btn-add:disabled { background: #555; color: #aaa; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- BOTÓN PARA CAMBIAR DE VISTA --- */
        .toggle-view-btn {
            background: rgba(212, 175, 55, 0.1); color: #d4af37; border: 1px solid #d4af37;
            padding: 10px 25px; font-family: 'Cinzel', serif; font-size: 1rem; border-radius: 30px;
            cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px; z-index: 10;
        }
        .toggle-view-btn:hover { background: rgba(212, 175, 55, 0.3); box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); transform: translateY(-2px); }

        /* --- ESCENARIO DE LA RULETA 3D --- */
        .scene { width: 300px; height: 400px; perspective: 1200px; position: relative; margin-top: 20px; transition: opacity 0.5s; }
        .carousel { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 1s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .carousel-cell {
            position: absolute; width: 260px; height: 350px; left: 20px; top: 20px;
            background: rgba(10, 10, 10, 0.9); border: 2px solid #d4af37; border-radius: 10px;
            overflow: hidden; cursor: pointer; box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.2);
            transition: transform 0.5s, filter 0.5s; -webkit-box-reflect: below 10px linear-gradient(transparent, transparent, rgba(0,0,0,0.4));
        }
        .carousel-cell:hover { filter: brightness(1.2); border-color: #fff; }
        .carousel-cell img { width: 100%; height: 100%; object-fit: cover; }

        .controls { margin-top: 60px; display: flex; gap: 30px; z-index: 10; transition: opacity 0.5s; }
        .btn-spin {
            background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 10px 20px;
            font-family: 'Cinzel', serif; font-size: 1.2rem; cursor: pointer; border-radius: 5px;
            transition: all 0.3s; backdrop-filter: blur(5px);
        }
        .btn-spin:hover { background: rgba(212, 175, 55, 0.2); box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }

        /* --- GALERÍA DE CUADRÍCULA --- */
        .grid-gallery {
            display: none; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
            width: 90%; max-width: 1000px; margin-top: 20px; padding-bottom: 50px; animation: fadeIn 0.5s ease-in-out;
        }
        .grid-item {
            position: relative; border: 2px solid rgba(212, 175, 55, 0.4); border-radius: 10px; overflow: hidden;
            cursor: pointer; aspect-ratio: 3/4; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .grid-item:hover { transform: scale(1.05); border-color: #d4af37; box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4); }
        .grid-item:hover img { transform: scale(1.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }

        /* --- MODO CINE (MODAL) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px); display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: rgba(20, 20, 30, 0.9); border: 2px solid #d4af37; border-radius: 10px; padding: 20px;
            max-width: 90%; max-height: 90vh; text-align: center; position: relative; transform: scale(0.8) translateY(50px);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column; align-items: center;
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        .modal-img { max-width: 100%; max-height: 60vh; border-radius: 5px; box-shadow: 0 5px 25px rgba(0,0,0,0.8); object-fit: contain; }
        .modal-info { margin-top: 20px; }
        .modal-date { font-family: 'Cinzel', serif; color: #d4af37; font-size: 1.2rem; margin-bottom: 10px; letter-spacing: 2px; }
        .modal-desc { font-size: 1.1rem; color: #fff; line-height: 1.5; max-width: 600px; }
        .btn-close {
            position: absolute; top: -20px; right: -20px; background: #d4af37; color: #000; border: none;
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; cursor: pointer;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); transition: transform 0.3s;
        }
        .btn-close:hover { transform: scale(1.1) rotate(90deg); }
        
        .btn-volver {
            position: absolute; top: 20px; left: 20px; text-decoration: none; color: #d4af37;
            font-family: 'Cinzel', serif; border: 1px solid #d4af37; padding: 8px 15px;
            border-radius: 4px; transition: all 0.3s;
        }
        .btn-volver:hover { background: rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body>

    <a href="index.html" class="btn-volver">◀ Volver al Menú</a>

    <h1>RULETA DEL AMOR</h1>
    <p class="subtitle">Agrega nuestros recuerdos y hazlos girar</p>

    <div class="upload-section">
        <div class="input-group">
            <label for="fotoInput">Elige una foto:</label>
            <input type="file" id="fotoInput" accept="image/*">
        </div>
        <div class="input-group">
            <label for="fechaInput">Fecha del momento:</label>
            <input type="date" id="fechaInput">
        </div>
        <div class="input-group">
            <label for="motivoInput">Motivo o Recuerdo:</label>
            <input type="text" id="motivoInput" placeholder="Ej: El día que fuimos por helados..." size="30">
        </div>
        <button id="btnAñadir" class="btn-add" onclick="agregarRecuerdoHibrido()">Añadir a la Ruleta ✨</button>
    </div>

    <button id="btnToggleView" class="toggle-view-btn" onclick="alternarVista()">Ver Galería Completa 🖼️</button>

    <div class="scene" id="sceneContainer">
        <div class="carousel" id="carousel"></div>
    </div>

    <div class="controls" id="spinControls">
        <button class="btn-spin" onclick="girar(-1)">◀ Girar Izquierda</button>
        <button class="btn-spin" onclick="girar(1)">Girar Derecha ▶</button>
    </div>

    <div class="grid-gallery" id="gridGallery"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="btn-close" onclick="cerrarModal()">✕</button>
            <img src="" id="modalImg" class="modal-img" alt="Recuerdo">
            <div class="modal-info">
                <div class="modal-date" id="modalDate"></div>
                <div class="modal-desc" id="modalDesc"></div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // 1. CONFIGURACIÓN DE FIREBASE (¡Ya inyectada con tus datos!)
        // =========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC0VZGfnJg_n0CwXP8meIRyVWFaJX8uh_k",
            authDomain: "fotos-5c358.firebaseapp.com",
            projectId: "fotos-5c358",
            storageBucket: "fotos-5c358.firebasestorage.app",
            messagingSenderId: "512653948106",
            appId: "1:512653948106:web:574862bc1117b226f17033"
        };

        // Inicializamos Firebase Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // =========================================================
        // 2. CONFIGURACIÓN DE IMGBB (Pon tu llave aquí abajo)
        // =========================================================
        const IMGBB_API_KEY = "895af48426eff814c28647b7e7d27ac8";

        // =========================================================
        // 3. LÓGICA DE LA INTERFAZ
        // =========================================================
        let recuerdos = [];
        const carousel = document.getElementById('carousel');
        const gridGallery = document.getElementById('gridGallery');
        const sceneContainer = document.getElementById('sceneContainer');
        const spinControls = document.getElementById('spinControls');
        const btnToggleView = document.getElementById('btnToggleView');
        const btnAñadir = document.getElementById('btnAñadir');
        
        let anguloActual = 0;
        let vistaActual = 'ruleta'; 

        // Escuchar la base de datos Firestore en tiempo real
        db.collection("recuerdos").orderBy("timestamp", "asc").onSnapshot((querySnapshot) => {
            recuerdos = [];
            querySnapshot.forEach((doc) => {
                recuerdos.push(doc.data());
            });

            if (recuerdos.length === 0) {
                recuerdos = [{
                    src: 'https://images.unsplash.com/photo-1518199266791-5375a83164ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                    fecha: 'Bienvenida',
                    motivo: 'Añade nuestra primera foto para comenzar este hermoso rincón juntos. ❤️'
                }];
            }
            
            actualizarRuleta();
            actualizarGaleria();
        });

        // Función para subir la foto a ImgBB y el registro a Firestore
        async function agregarRecuerdoHibrido() {
            const inputFoto = document.getElementById('fotoInput');
            const inputFecha = document.getElementById('fechaInput');
            const inputMotivo = document.getElementById('motivoInput');
            const file = inputFoto.files[0];

            if (!file || !inputFecha.value || !inputMotivo.value) {
                alert("Por favor, llena todos los campos (Foto, Fecha y Motivo).");
                return;
            }

            btnAñadir.innerText = "⏳ Subiendo recuerdo...";
            btnAñadir.disabled = true;

            const formData = new FormData();
            formData.append("image", file);

            try {
                // 1. Subir a ImgBB
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error("Fallo en la carga a ImgBB");
                }

                // 2. Obtener el link directo
                const downloadURL = result.data.url;

                // 3. Guardar en Firestore
                await db.collection("recuerdos").add({
                    src: downloadURL,
                    fecha: formatearFecha(inputFecha.value),
                    motivo: inputMotivo.value,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Limpiar inputs
                inputFoto.value = '';
                inputFecha.value = '';
                inputMotivo.value = '';
                alert("¡Recuerdo guardado con éxito para siempre! ✨❤️");

            } catch (error) {
                console.error("Error completo:", error);
                alert("Hubo un problema al guardar. Revisa que tu llave de ImgBB esté bien escrita.");
            } finally {
                btnAñadir.innerText = "Añadir a la Ruleta ✨";
                btnAñadir.disabled = false;
            }
        }

        // --- FUNCIONES VISUALES ---
        function actualizarRuleta() {
            carousel.innerHTML = ''; 
            const numFotos = recuerdos.length;
            const theta = 360 / (numFotos || 1); 
            const cellSize = 300; 
            const radio = Math.round((cellSize / 2) / Math.tan(Math.PI / (numFotos < 3 ? 3 : numFotos)));

            recuerdos.forEach((recuerdo, index) => {
                const cell = document.createElement('div');
                cell.className = 'carousel-cell';
                cell.style.transform = `rotateY(${index * theta}deg) translateZ(${radio}px)`;
                
                const img = document.createElement('img');
                img.src = recuerdo.src;
                cell.onclick = () => abrirModal(recuerdo.src, recuerdo.fecha, recuerdo.motivo);

                cell.appendChild(img);
                carousel.appendChild(cell);
            });
            girar(0); 
        }

        function actualizarGaleria() {
            gridGallery.innerHTML = ''; 
            recuerdos.forEach((recuerdo) => {
                const gridItem = document.createElement('div');
                gridItem.className = 'grid-item';
                
                const img = document.createElement('img');
                img.src = recuerdo.src;
                gridItem.onclick = () => abrirModal(recuerdo.src, recuerdo.fecha, recuerdo.motivo);

                gridItem.appendChild(img);
                gridGallery.appendChild(gridItem);
            });
        }

        function alternarVista() {
            if (vistaActual === 'ruleta') {
                sceneContainer.classList.add('hidden');
                spinControls.classList.add('hidden');
                gridGallery.style.display = 'grid'; 
                btnToggleView.innerText = 'Volver a la Ruleta 🎡';
                vistaActual = 'galeria';
            } else {
                gridGallery.style.display = 'none';
                sceneContainer.classList.remove('hidden');
                spinControls.classList.remove('hidden');
                btnToggleView.innerText = 'Ver Galería Completa 🖼️';
                vistaActual = 'ruleta';
            }
        }

        function girar(direccion) {
            const numFotos = recuerdos.length;
            if(numFotos === 0) return;
            const theta = 360 / numFotos;
            anguloActual += theta * direccion * -1; 
            carousel.style.transform = `translateZ(-200px) rotateY(${anguloActual}deg)`;
        }

        function abrirModal(src, fecha, motivo) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalDate').innerText = fecha;
            document.getElementById('modalDesc').innerText = motivo;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) cerrarModal();
        });

        function formatearFecha(fechaString) {
            if(fechaString.includes('Bienvenida')) return fechaString; 
            const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
            const fechaObj = new Date(fechaString + 'T00:00:00'); 
            return fechaObj.toLocaleDateString('es-ES', opciones);
        }
    </script>
</body>
</html>

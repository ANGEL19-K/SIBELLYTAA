<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fuegos Artificiales 2026</title>
<style>
    :root{
        --accent:#ff0066;
        --gold:#ffcc00;
    }
    html,body{
        height:100%;
        margin:0;
        background:#000;
        overflow:hidden;
        font-family:Inter, Arial, Helvetica, sans-serif;
    }
    /* Fondo con ligero gradiente nocturno */
    #background{
        position:fixed;
        inset:0;
        background:radial-gradient(ellipse at 20% 10%, rgba(20,20,30,0.25), transparent 10%),
                   linear-gradient(180deg,#001014 0%, #000 70%);
        z-index:0;
    }
    canvas{
        display:block;
        position:fixed;
        top:0;
        left:0;
        z-index:1;
    }
    /* Mensaje centrado mejor para móvil */
    #message{
        position:fixed;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        width:90%;
        max-width:600px;
        text-align:center;
        color:#fff;
        z-index:3;
        pointer-events:none;
        padding:20px;
    }
    #message h1{
        margin:0 0 10px 0;
        font-size:clamp(1.8rem, 7vw, 4rem);
        letter-spacing:3px;
        background:linear-gradient(90deg,var(--accent),#ff66aa,var(--gold));
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        text-shadow:0 0 18px rgba(255,0,102,0.12),0 6px 24px rgba(0,0,0,0.6);
        animation:softPulse 3s ease-in-out infinite;
        line-height:1.2;
    }
    #message h2{
        margin:0;
        font-size:clamp(1.2rem, 5vw, 2.2rem);
        color:var(--gold);
        text-shadow:0 0 10px rgba(255,204,0,0.6);
        transform-origin:center;
        animation:floatY 4s ease-in-out infinite;
        line-height:1.3;
    }
    @keyframes softPulse{
        0%{transform:scale(1);}
        50%{transform:scale(1.03);}
        100%{transform:scale(1);}
    }
    @keyframes floatY{
        0%{transform:translateY(0);}
        50%{transform:translateY(-6px);}
        100%{transform:translateY(0);}
    }
    #info{
        position:fixed;
        bottom:15px;
        right:15px;
        color:rgba(255,255,255,0.6);
        z-index:3;
        font-size:0.8rem;
        text-align:right;
        padding:0 10px;
    }
    
    /* Ajustes específicos para móvil */
    @media (max-height: 700px) {
        #message {
            top:45%;
        }
        #message h1 {
            font-size:clamp(1.6rem, 6vw, 3.5rem);
            margin-bottom:5px;
        }
        #message h2 {
            font-size:clamp(1.1rem, 4vw, 2rem);
        }
    }
    
    @media (max-height: 500px) {
        #message {
            top:40%;
        }
    }
</style>
</head>
<body>
<div id="background" aria-hidden="true"></div>
<div id="message" aria-hidden="false">
    <h1>¡FELIZ AÑO 2026!</h1>
    <h2>SIBELLY</h2>
    <h2>TE QUIERO MUCHO :D</h2>
</div>
<canvas id="canvas"></canvas>

<!-- Audio para música de fondo -->
<audio id="backgroundMusic" loop>
    <source src="https://www.dropbox.com/scl/fi/cs1rdhxfb77pq41ryf02d/WhatsApp-Video-2025-12-31-at-5.23.12-PM-_1_.mp3.mp3?rlkey=tggvyw5tehygayaaroqqdisu1&st=bt4upxl8&dl=1" type="audio/mpeg">
</audio>

<script>
// Canvas y configuración
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {alpha:true});

// Elemento de audio
const backgroundMusic = document.getElementById('backgroundMusic');

// Función para iniciar música (necesario para autoplay en móviles)
function startMusic() {
    // Intentar reproducir música
    backgroundMusic.volume = 0.7; // Volumen moderado
    const playPromise = backgroundMusic.play();
    
    // Manejar posibles errores de autoplay
    if (playPromise !== undefined) {
        playPromise.then(() => {
            console.log("Música iniciada correctamente");
        }).catch(error => {
            console.log("Autoplay prevenido, se requiere interacción del usuario");
            // Intentar de nuevo cuando el usuario interactúe
            document.addEventListener('click', function startMusicOnInteraction() {
                backgroundMusic.play();
                document.removeEventListener('click', startMusicOnInteraction);
            }, { once: true });
        });
    }
}

function resize(){ 
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Variables globales
let particles = [];
let rockets = [];

// Colores vibrantes para fuegos artificiales
const palette = ['#ff3366','#ff0066','#ff9900','#ffcc00','#00ccff','#00ff99','#cc00ff','#ff66ff','#66ccff'];

// Función para convertir hex a rgba
function hexToRgba(hex, a=1){
    const c = hex.replace('#','');
    const r = parseInt(c.substring(0,2),16);
    const g = parseInt(c.substring(2,4),16);
    const b = parseInt(c.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
}

// Clase Cohete
class Rocket {
    constructor(x, targetY){
        this.x = x ?? (Math.random()*canvas.width);
        this.y = canvas.height + 10;
        this.vx = (Math.random()-0.5) * 1.2;
        this.vy = - (Math.random()*3 + 6);
        this.targetY = targetY ?? (Math.random()*(canvas.height*0.6) + 100);
        this.color = palette[Math.floor(Math.random()*palette.length)];
        this.size = Math.random()*2 + 2;
        this.trail = [];
        this.type = Math.random() < 0.3 ? 'heart' : 'circle';
        this.hasExploded = false;
    }
    
    update(){
        // Física
        this.vx += (Math.random()-0.5)*0.02;
        this.vy += 0.03;
        this.x += this.vx;
        this.y += this.vy;
        
        // Rastro
        this.trail.push({x:this.x, y:this.y, life:15});
        if(this.trail.length > 15) this.trail.shift();
        for(let t of this.trail) t.life--;
        
        // Explotar cuando llegue al objetivo o empiece a caer
        if((this.y <= this.targetY || this.vy > 0) && !this.hasExploded){
            this.explode();
            return false;
        }
        
        return true;
    }
    
    draw(){
        ctx.globalCompositeOperation = 'lighter';
        
        // Dibujar rastro
        for(let i=0;i<this.trail.length;i++){
            const s = this.trail[i];
            const alpha = (s.life/15)*0.5;
            const size = this.size * 0.7 * (s.life/15);
            
            ctx.fillStyle = hexToRgba(this.color, alpha);
            ctx.beginPath();
            ctx.arc(s.x, s.y, size, 0, Math.PI*2);
            ctx.fill();
        }
        
        // Dibujar cohete
        ctx.fillStyle = hexToRgba(this.color, 0.9);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
        
        // Brillo interior
        ctx.fillStyle = hexToRgba('#ffffff', 0.7);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size*0.5, 0, Math.PI*2);
        ctx.fill();
        
        ctx.globalCompositeOperation = 'source-over';
    }
    
    explode(){
        this.hasExploded = true;
        const ex = this.x;
        const ey = this.y;
        
        if(this.type === 'heart'){
            createHeartExplosion(ex, ey, this.color);
        } else {
            createCircleExplosion(ex, ey, this.color);
        }
        
        // Explosión secundaria ocasional
        if(Math.random() < 0.3){
            setTimeout(()=> {
                createCircleExplosion(
                    ex + (Math.random()-0.5)*60, 
                    ey + (Math.random()-0.5)*40, 
                    palette[Math.floor(Math.random()*palette.length)]
                );
            }, 200);
        }
    }
}

// Crear explosión circular
function createCircleExplosion(x, y, color){
    const count = 80 + Math.random()*40;
    
    for(let i=0;i<count;i++){
        const angle = Math.random() * Math.PI*2;
        const speed = Math.random()*3 + 2;
        const size = Math.random()*2 + 0.8;
        const life = 70 + Math.random()*60;
        
        particles.push({
            x, y, size, color,
            vx: Math.cos(angle)*speed,
            vy: Math.sin(angle)*speed,
            gravity: 0.04,
            alpha: 1,
            life: life,
            maxLife: life
        });
    }
}

// Crear explosión de corazón
function createHeartExplosion(x, y, color){
    const count = 70 + Math.random()*30;
    
    for(let i=0;i<count;i++){
        const t = Math.random() * Math.PI*2;
        const hx = 16 * Math.pow(Math.sin(t),3);
        const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const speed = Math.random()*2 + 1.5;
        const size = Math.random()*1.8 + 0.6;
        const life = 80 + Math.random()*50;
        
        particles.push({
            x, y, size, color,
            vx: hx * 0.07 * speed,
            vy: -hy * 0.07 * speed,
            gravity: 0.035,
            alpha: 1,
            life: life,
            maxLife: life
        });
    }
}

// Actualizar partículas
function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha = p.life / p.maxLife;
        p.life--;
        
        if(p.life <= 0){
            particles.splice(i,1);
        }
    }
}

// Dibujar todo
function draw(){
    // Fondo con desvanecimiento suave
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    
    // Partículas
    ctx.globalCompositeOperation = 'lighter';
    for(let p of particles){
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        
        // Brillo interior para algunas partículas
        if(Math.random() < 0.3){
            ctx.globalAlpha = p.alpha * 0.5;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size*0.5, 0, Math.PI*2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    
    // Cohetes
    for(let r of rockets){
        r.draw();
    }
}

// Lanzar cohete
function launchRocket(x, y){
    rockets.push(new Rocket(x, y));
}

// Lanzar cohete aleatorio
function launchRandomRocket(){
    const x = Math.random()*canvas.width;
    const targetY = Math.random()*(canvas.height*0.5) + 100;
    launchRocket(x, targetY);
}

// Actualizar cohetes
function updateRockets(){
    for(let i=rockets.length-1;i>=0;i--){
        const r = rockets[i];
        const alive = r.update();
        if(!alive) rockets.splice(i,1);
    }
}

// Bucle principal
function animate(){
    // Lanzar cohetes automáticamente (más frecuente)
    if(Math.random() < 0.04){
        launchRandomRocket();
    }
    
    // Asegurar que siempre haya cohetes
    if(rockets.length < 3 && Math.random() < 0.1){
        launchRandomRocket();
    }
    
    // Actualizar y dibujar
    updateRockets();
    updateParticles();
    draw();
    
    requestAnimationFrame(animate);
}

// Click para lanzar cohete
canvas.addEventListener('click', (e)=>{
    launchRocket(e.clientX, e.clientY);
    
    // Iniciar música si no se ha iniciado (para móviles que bloquean autoplay)
    if (backgroundMusic.paused) {
        backgroundMusic.volume = 0.7;
        backgroundMusic.play().catch(e => console.log("No se pudo reproducir música:", e));
    }
});

// También iniciar música con cualquier interacción táctil
document.addEventListener('touchstart', function() {
    if (backgroundMusic.paused) {
        backgroundMusic.volume = 0.7;
        backgroundMusic.play().catch(e => console.log("No se pudo reproducir música:", e));
    }
}, { once: true });

// Iniciar con varios cohetes inmediatamente
for(let i=0;i<4;i++){
    setTimeout(() => launchRandomRocket(), i*300);
}

// Intentar iniciar música automáticamente (puede fallar en algunos navegadores móviles)
setTimeout(startMusic, 1000);

// Iniciar animación
animate();

</script>
</body>
</html>
